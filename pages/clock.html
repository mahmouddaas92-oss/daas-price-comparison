<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الساعة العالمية | DAAS</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/clock-style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 font-sans text-gray-100 min-h-screen">

    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fas fa-clock text-3xl text-white"></i>
                    <h1 class="text-3xl font-black tracking-wider text-white">الساعة العالمية</h1>
                </div>
                <a href="../index.html" class="text-white hover:text-blue-200 transition flex items-center gap-2">
                    <i class="fas fa-arrow-right"></i>
                    العودة
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">معرفة الوقت في العالم</h2>
            <p class="text-gray-400 text-lg">ساعة رقمية حية تعرض الوقت في 24 منطقة زمنية</p>
        </div>

        <div class="mb-8 max-w-2xl mx-auto">
            <div class="flex gap-4 flex-col sm:flex-row">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute right-4 top-3.5 text-gray-500"></i>
                    <input type="text" id="searchTimezone" placeholder="ابحث عن منطقة..." class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 pr-10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="toggleFormat()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-sync"></i>
                    <span id="formatToggle">صيغة 24 ساعة</span>
                </button>
            </div>
        </div>

        <div id="timezoneGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loaded by JavaScript -->
        </div>
    </main>

    <script src="../js/clock.js"></script>
</body>
</html>
