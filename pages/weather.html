<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة معلومات الطقس | DAAS</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/weather-style.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 font-sans text-gray-800 min-h-screen">

    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fas fa-cloud-sun text-3xl text-white"></i>
                    <h1 class="text-3xl font-black tracking-wider text-white">لوحة معلومات الطقس</h1>
                </div>
                <a href="../index.html" class="text-white hover:text-blue-200 transition flex items-center gap-2">
                    <i class="fas fa-arrow-right"></i>
                    العودة
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600">معلومات الطقس الحية</h2>
            <p class="text-gray-600 text-lg">احصل على معلومات الطقس الحالية والتوقعات لأي مدينة في العالم</p>
        </div>

        <!-- Search Section -->
        <div class="mb-8 max-w-2xl mx-auto">
            <div class="flex gap-2">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute right-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="citySearch" placeholder="ابحث عن مدينة..." class="w-full bg-white border-2 border-gray-300 rounded-lg px-4 py-3 pr-10 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                </div>
                <button onclick="searchWeather()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg transition flex items-center gap-2">
                    <i class="fas fa-search"></i>
                    ابحث
                </button>
            </div>
        </div>

        <!-- Current Weather -->
        <div id="currentWeatherContainer" class="mb-12 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Loaded by JavaScript -->
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastContainer" class="mt-12">
            <h3 class="text-2xl font-bold mb-6 text-gray-800">توقعات 5 أيام</h3>
            <div id="forecastGrid" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <!-- Loaded by JavaScript -->
            </div>
        </div>

        <!-- Multiple Cities Comparison -->
        <div class="mt-12 bg-white rounded-lg shadow-lg p-8">
            <h3 class="text-2xl font-bold mb-6 text-gray-800">مقارنة الطقس في عدة مدن</h3>
            <div class="mb-4 flex gap-2 flex-wrap">
                <div class="flex-1 min-w-64">
                    <input type="text" id="multipleCities" placeholder="أدخل أسماء المدن مفصولة بفواصل" class="w-full bg-gray-50 border-2 border-gray-300 rounded-lg px-4 py-3 text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="compareMultipleCities()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-3 rounded-lg transition">
                    مقارنة
                </button>
            </div>
            <div id="multipleWeatherGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Loaded by JavaScript -->
            </div>
        </div>
    </main>

    <footer class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white mt-16 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2024 DAAS - منصة المقارنة العالمية للأسعار</p>
            <p class="text-sm mt-2">لوحة معلومات الطقس - آداة مساعدة مجانية</p>
        </div>
    </footer>

    <script src="../js/weather.js"></script>
</body>
</html>
